name: Build Nexus Hub App APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-hub-android-signing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build original React UI
        run: |
          npm ci
          npm run check
          npm run check:design
          node --test tests/replica-plan.test.mjs tests/replica-sync.test.mjs tests/mirror.test.mjs tests/ideas.test.mjs tests/idea-attachments.test.mjs tests/idea-resolution.test.mjs tests/economy-*.test.mjs
          npm run build
      - name: Restore stable private signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android-signing.py
      - name: Build signed APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon -PskipWebBuild=true :app:assembleRelease :app:lintRelease
      - name: Verify APK signature and prepare download
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/nexus-hub-app.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apk/nexus-hub-app.apk
          sha256sum apk/nexus-hub-app.apk > apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-hub-app-apk
          path: apk/
          retention-days: 30
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v1.0.${GITHUB_RUN_NUMBER}" apk/nexus-hub-app.apk apk/SHA256SUMS.txt --title "Nexus Hub App 1.0.${GITHUB_RUN_NUMBER}" --notes "Fristående Android-app med lokalt paketerat Nexus Hub-gränssnitt. Installera nexus-hub-app.apk. Senare versioner uppdaterar samma app och bevarar lokala inställningar och GitHub-token."
      - name: Remove runner signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/nexushub-signing"
