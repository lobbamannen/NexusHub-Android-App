name: Build Nexus Hub App APK
on:
  push:
    branches: [main, codex/nexus-intelligence-foundation-20261030]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-hub-android-signing-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          # Feature branch builds must also WRITE reusable Gradle caches.
          # Without this, subsequent branch builds repeatedly start cold.
          cache-read-only: false
      - name: Install Android platform if missing
        run: |
          set -euo pipefail
          NEED=()
          if [ ! -d "${ANDROID_HOME}/platforms/android-35" ]; then NEED+=("platforms;android-35"); fi
          if [ ! -d "${ANDROID_HOME}/build-tools/35.0.0" ]; then NEED+=("build-tools;35.0.0"); fi
          if [ ${#NEED[@]} -gt 0 ]; then sdkmanager --install "${NEED[@]}"; fi

      # Cortex pattern: immutable pinned source cached independently of compiled
      # binaries. Native/Gradle/Kotlin changes must NOT download llama.cpp again.
      - name: Restore pinned llama.cpp source
        id: cache-llama-source
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/llama.cpp
          key: ${{ runner.os }}-nexus-llama-source-v1-${{ hashFiles('llama-revision.txt') }}

      - name: Fetch pinned llama.cpp on cache miss
        if: steps.cache-llama-source.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PINNED_SHA=$(tr -d '\r\n' < llama-revision.txt)
          SRC="app/src/main/cpp/llama.cpp"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$SRC" fetch --depth 1 origin "$PINNED_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$PINNED_SHA"

      - name: Verify pinned llama source
        run: |
          set -euo pipefail
          PINNED_SHA=$(tr -d '\r\n' < llama-revision.txt)
          SRC="app/src/main/cpp/llama.cpp"
          test -f "$SRC/CMakeLists.txt"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$PINNED_SHA"
          if [ -n "$(git -C "$SRC" status --porcelain --untracked-files=no)" ]; then
            echo "::error::Cached llama.cpp source contains tracked modifications"
            exit 1
          fi

      # Cortex pattern: package exact native .so files, NOT ephemeral .cxx intermediates.
      # The cache key includes the pinned llama revision and all local native inputs.
      - name: Restore prebuilt llama.cpp core libraries
        id: cache-core-native
        uses: actions/cache/restore@v4
        with:
          path: .cache/core-native-libs/arm64-v8a
          key: ${{ runner.os }}-nexus-core-prebuilt-v1-ndk28.2-cmake3.22-${{ hashFiles('llama-revision.txt', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/cpp/*.cpp', 'app/src/main/cpp/*.c', 'app/src/main/cpp/*.h', 'app/src/main/cpp/*.hpp', 'scripts/patch-llama-cpu-jarvis-audit.py', 'scripts/run-llama-cpu-jarvis-audit.py', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Validate and stage cached core libraries
        if: steps.cache-core-native.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          SRC=".cache/core-native-libs/arm64-v8a"
          DEST="app/src/main/jniLibs/arm64-v8a"
          for lib in libllama_android.so libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            test -s "$SRC/$lib" || { echo "::error::Native cache is missing $lib"; exit 1; }
          done
          test "$(cat "$SRC/llama-commit.txt")" = "$(tr -d '\r\n' < llama-revision.txt)"
          (cd "$SRC" && sha256sum --check SHA256SUMS)
          mkdir -p "$DEST"
          cp -v "$SRC"/*.so "$DEST/"
          echo "PREBUILT_NATIVE=true" >> "$GITHUB_ENV"
          echo "Validated core native binaries restored. Release CMake compilation will be skipped."

      # Restore and save the expensive Snapdragon artifacts explicitly. The save happens
      # immediately after a successful accelerator build, so a later APK/link failure does
      # not throw away completed work. The Jarvis audit patch is part of the cache identity.
      - name: Restore Snapdragon OpenCL and Hexagon Libraries
        id: cache-snapdragon-libs
        uses: actions/cache/restore@v4
        with:
          path: .cache/snapdragon-libs/arm64-v8a
          key: nexus-snapdragon-libs-v1-v0.7-${{ hashFiles('llama-revision.txt', 'scripts/patch-llama-hexagon-jarvis-audit.py') }}


      - name: Ensure Android Native Toolchain
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not configured on the runner."
            exit 1
          fi
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not locate sdkmanager under Android SDK root: $SDK_ROOT"
            exit 1
          fi
          NEED_INSTALL=()
          if [ ! -d "$SDK_ROOT/ndk/28.2.13676358" ]; then NEED_INSTALL+=("ndk;28.2.13676358"); fi
          if [ ! -d "$SDK_ROOT/cmake/3.22.1" ]; then NEED_INSTALL+=("cmake;3.22.1"); fi
          if [ ${#NEED_INSTALL[@]} -gt 0 ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "${NEED_INSTALL[@]}"
          fi

      - name: Build Snapdragon Accelerator Libraries
        if: steps.cache-snapdragon-libs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PINNED_SHA=$(tr -d '\r\n' < llama-revision.txt)
          TOOLCHAIN_IMAGE="ghcr.io/snapdragon-toolchain/arm64-android:v0.7"
          LLAMA_SRC="${RUNNER_TEMP:-/tmp}/jarvis-llama-snapdragon-src"
          DEST=".cache/snapdragon-libs/arm64-v8a"

          rm -rf "$LLAMA_SRC"
          mkdir -p "$LLAMA_SRC" "$DEST"

          if [ -d "app/src/main/cpp/llama.cpp/.git" ]; then
            cp -r app/src/main/cpp/llama.cpp/. "$LLAMA_SRC/"
          else
            git clone https://github.com/ggml-org/llama.cpp.git "$LLAMA_SRC"
            git -C "$LLAMA_SRC" checkout "$PINNED_SHA"
          fi

          test "$(git -C "$LLAMA_SRC" rev-parse HEAD)" = "$PINNED_SHA"
          if [ ! -f "$LLAMA_SRC/docs/backend/snapdragon/CMakeUserPresets.json" ]; then
            echo "::error::Snapdragon CMake preset missing from pinned llama.cpp commit."
            exit 1
          fi
          cp "$LLAMA_SRC/docs/backend/snapdragon/CMakeUserPresets.json" "$LLAMA_SRC/"

          # The canonical checkout stays pristine. Only this disposable accelerator source copy
          # receives a tiny diagnostic export that toggles already-existing Hexagon profile knobs.
          python3 "${GITHUB_WORKSPACE}/scripts/patch-llama-hexagon-jarvis-audit.py" "$LLAMA_SRC"
          sha256sum "${GITHUB_WORKSPACE}/scripts/patch-llama-hexagon-jarvis-audit.py" | awk '{print $1}' > "$DEST/hexagon-audit-patch-sha256.txt"

          docker pull "$TOOLCHAIN_IMAGE"
          docker image inspect "$TOOLCHAIN_IMAGE" --format '{{index .RepoDigests 0}}' > "$DEST/toolchain-digest.txt"
          printf '%s\n' "$PINNED_SHA" > "$DEST/llama-commit.txt"
          docker run --rm \
            -v "${LLAMA_SRC}:/workspace" \
            -w /workspace \
            --platform linux/amd64 \
            "$TOOLCHAIN_IMAGE" \
            bash -c "
              set -e
              git config --global --add safe.directory /workspace
              cmake --preset arm64-android-snapdragon-release -B build-snapdragon
              cmake --build build-snapdragon --parallel \$(nproc) --target ggml-opencl ggml-hexagon htp-v73 htp-v75 htp-v79 htp-v81
            "

          find "$LLAMA_SRC/build-snapdragon" -type f -name "libggml-opencl.so" -exec cp -v {} "$DEST/" \;
          find "$LLAMA_SRC/build-snapdragon" -type f -name "libggml-hexagon.so" -exec cp -v {} "$DEST/" \;
          find "$LLAMA_SRC/build-snapdragon" -type f -name "libggml-htp-*.so" -exec cp -v {} "$DEST/" \;
          sudo chown -R "$(id -u):$(id -g)" "$DEST" || true
          chmod 755 "$DEST"/*.so || true

          if [ ! -f "$DEST/libggml-opencl.so" ] || [ ! -f "$DEST/libggml-hexagon.so" ]; then
            echo "::error::Required Snapdragon OpenCL/Hexagon libraries were not produced."
            exit 1
          fi
          for htp in v73 v75 v79 v81; do
            if [ ! -f "$DEST/libggml-htp-${htp}.so" ]; then
              echo "::error::Required libggml-htp-${htp}.so was not produced."
              exit 1
            fi
          done

      - name: Save Snapdragon OpenCL and Hexagon Libraries
        if: steps.cache-snapdragon-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/snapdragon-libs/arm64-v8a
          key: nexus-snapdragon-libs-v1-v0.7-${{ hashFiles('llama-revision.txt', 'scripts/patch-llama-hexagon-jarvis-audit.py') }}

      - name: Stage Snapdragon Accelerator Libraries
        run: |
          set -euo pipefail
          SRC=".cache/snapdragon-libs/arm64-v8a"
          DEST="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          if [ ! -d "$SRC" ]; then
            echo "::error::Snapdragon library cache directory is missing."
            exit 1
          fi
          test "$(cat "$SRC/llama-commit.txt")" = "$(tr -d '\r\n' < llama-revision.txt)"
          test -s "$SRC/hexagon-audit-patch-sha256.txt"
          cp -v "$SRC"/*.so "$DEST/"
          mkdir -p app/src/main/assets
          python3 - <<'PYCODE'
          import hashlib, json, pathlib
          source = pathlib.Path('.cache/snapdragon-libs/arm64-v8a')
          data = {'llama_commit': (source/'llama-commit.txt').read_text().strip(),
                  'toolchain_digest': (source/'toolchain-digest.txt').read_text().strip(),
                  'hexagon_audit_patch_sha256': (source/'hexagon-audit-patch-sha256.txt').read_text().strip(),
                  'accelerator_sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(source.glob('*.so'))}}
          pathlib.Path('app/src/main/assets/gemma-native-build.json').write_text(json.dumps(data, indent=2))
          PYCODE
          chmod 755 "$DEST"/*.so || true
          echo "Accelerator libraries staged:"
          ls -lh "$DEST"

      # Compile the production app without running unit, design or browser tests.
      # Tests remain in source for explicit/manual execution, not as APK build gates.
      - name: Build production React UI
        run: |
          npm ci
          npm run build

      - name: Restore stable private signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android-signing.py
      - name: Build signed APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -a
          source .github/posthog.env
          set +a
          # Only the cache-hit path disables CMake; on a miss Gradle compiles
          # the native core normally. App/Kotlin/UI still rebuild every time.
          EXTRA_ARGS=()
          if [ "${PREBUILT_NATIVE:-false}" = "true" ]; then
            EXTRA_ARGS+=("-PusePrebuiltNative=true")
          fi
          gradle --build-cache --no-daemon -PskipWebBuild=true "${EXTRA_ARGS[@]}" :app:assembleRelease :wear:assembleRelease
      # The cold build has now produced a real APK. Extract its actual native
      # payload into a persistent cache for subsequent builds (Cortex approach).
      - name: Collect compiled core libraries from signed APK
        if: steps.cache-core-native.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          DEST=".cache/core-native-libs/arm64-v8a"
          mkdir -p "$DEST"
          for lib in libllama_android.so libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            unzip -p "$APK" "lib/arm64-v8a/$lib" > "$DEST/$lib"
            test -s "$DEST/$lib" || { echo "::error::Missing native core library $lib"; exit 1; }
          done
          # Additional native dependencies are copied when packaged by CMake.
          for lib in libllama-common.so libc++_shared.so; do
            if unzip -Z1 "$APK" | grep -qx "lib/arm64-v8a/$lib"; then
              unzip -p "$APK" "lib/arm64-v8a/$lib" > "$DEST/$lib"
            fi
          done
          printf '%s\n' "$(tr -d '\r\n' < llama-revision.txt)" > "$DEST/llama-commit.txt"
          (cd "$DEST" && sha256sum ./*.so > SHA256SUMS && sha256sum --check SHA256SUMS)
          echo "Core native cache populated from actual release APK binaries."

      - name: Save compiled core libraries for future APK builds
        if: steps.cache-core-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/core-native-libs/arm64-v8a
          key: ${{ steps.cache-core-native.outputs.cache-primary-key }}

      - name: Verify native model and accelerator libraries in APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          unzip -l "$APK" > "$RUNNER_TEMP/nexus-native-list.txt"
          for lib in libllama_android.so libllama.so libggml.so libggml-base.so libggml-cpu.so libggml-opencl.so libggml-hexagon.so; do
            grep -q "lib/arm64-v8a/$lib" "$RUNNER_TEMP/nexus-native-list.txt" || { echo "::error::$lib not packaged"; exit 1; }
          done
          for htp in v73 v75 v79 v81; do
            grep -q "lib/arm64-v8a/libggml-htp-$htp.so" "$RUNNER_TEMP/nexus-native-list.txt" || { echo "::error::HTP $htp missing"; exit 1; }
          done
          echo "Native packaging verified; this is NOT proof of NPU execution."
      - name: Verify APK signature and prepare download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/nexus-hub-app.apk
          cp wear/build/outputs/apk/release/wear-release.apk apk/nexus-hub-watch.apk
          cp docs/android-install.md apk/INSTALLATION.md
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apk/nexus-hub-app.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apk/nexus-hub-watch.apk
          gh release download --repo "$GITHUB_REPOSITORY" --pattern nexus-hub-app.apk --dir previous-apk
          python3 scripts/verify-battery-apks.py apk/nexus-hub-app.apk apk/nexus-hub-watch.apk previous-apk/nexus-hub-app.apk
          sha256sum apk/nexus-hub-app.apk apk/nexus-hub-watch.apk > apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-hub-app-apk
          path: apk/
          retention-days: 30
      - name: Publish installable APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v1.0.${GITHUB_RUN_NUMBER}" apk/nexus-hub-app.apk apk/nexus-hub-watch.apk apk/INSTALLATION.md apk/SHA256SUMS.txt --title "Nexus Hub App 1.0.${GITHUB_RUN_NUMBER}" --notes-file docs/android-install.md
      - name: Remove runner signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/nexushub-signing"
