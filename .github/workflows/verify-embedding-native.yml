name: Verify EmbeddingGemma Android Kotlin
on:
  push:
    branches: [codex/embeddinggemma2-ideas-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm ci && npm run build
      # Only compile Kotlin. No native llama.cpp/Hexagon rebuild is needed to
      # diagnose embedding SDK compatibility.
      - name: Compile Android Kotlin and run unit tests
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest -PskipWebBuild=true -PusePrebuiltNative=true --no-daemon --stacktrace
