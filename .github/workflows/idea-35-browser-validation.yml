name: Verify idea 35 browser contracts
on:
  push:
    branches: [fix/idea-35-complete-recovery-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        surface: [activity, calendar, connected, paste, pulse, scroll, weather, intelligence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Run real browser contracts
        env:
          SURFACE: ${{ matrix.surface }}
        run: CHROME_PATH="$(command -v google-chrome)" node "scripts/${SURFACE}-ui-check.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idea35-ui-${{ matrix.surface }}
          path: ${{ matrix.surface }}-ui/
          retention-days: 14
