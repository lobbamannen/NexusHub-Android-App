name: Verify idea 35 audit regressions
on:
  push:
    branches: [fix/idea-35-audit-31, fix/idea-35-complete-recovery-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check TypeScript, preserved design, and relevant behavior
        run: |
          npm run check
          npm run check:design
          npm run test:current
      - name: Verify actual native streaming helper
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic tests/native/runtime-utils-test.cpp -o /tmp/runtime-utils-test
          /tmp/runtime-utils-test
      - run: npm run build
